syntax = "proto3";

package chats_service.chats.v1;

option go_package = "chats_service/chats/v1;chatsv1";

import "chats_service/chats/v1/models.proto";

service ChatsService {
  rpc CreateChat(CreateChatRequest) returns (CreateChatResponse);

  rpc GetOrCreatePrivateChat(GetOrCreatePrivateChatRequest) returns (GetOrCreatePrivateChatResponse);

  rpc ListUserChats(ListUserChatsRequest) returns (ListUserChatsResponse);

  rpc GetChatDetails(GetChatDetailsRequest) returns (GetChatDetailsResponse);

  rpc CheckChatMember(CheckChatMemberRequest) returns (CheckChatMemberResponse);

  rpc UpdateLastReadMessage(UpdateLastReadMessageRequest) returns (UpdateLastReadMessageResponse);

  rpc TouchChatLastMessage(TouchChatLastMessageRequest) returns (TouchChatLastMessageResponse);
}

message CreateChatRequest {
  ChatType type = 1;
  repeated string participant_ids = 2;
  optional string title = 3;
  string owner_id = 4;
}

message CreateChatResponse {
  Chat chat = 1;
}

message GetOrCreatePrivateChatRequest {
  string owner_id = 1;
  string participant_id = 2;
}

message GetOrCreatePrivateChatResponse {
  Chat chat = 1;
  repeated ChatMember members = 2;
  bool created = 3;
}

message ListUserChatsRequest {
  string user_id = 1;
}

message ListUserChatsResponse {
  repeated Chat chats = 1;
}

message GetChatDetailsRequest {
  string chat_id = 1;
}

message GetChatDetailsResponse {
  Chat chat = 1;
  repeated ChatMember members = 2;
}

message CheckChatMemberRequest {
  string chat_id = 1;
  string user_id = 2;
}

message CheckChatMemberResponse {
  bool is_member = 1;
  ChatMember member = 2;
}

message UpdateLastReadMessageRequest {
  string chat_id = 1;
  string user_id = 2;
  int64 last_read_message_id = 3;
}

message UpdateLastReadMessageResponse {}

message TouchChatLastMessageRequest {
  string chat_id = 1;
  int64 last_message_id = 2;
  string last_message_preview = 3;
}

message TouchChatLastMessageResponse {
  Chat chat = 1;
}
